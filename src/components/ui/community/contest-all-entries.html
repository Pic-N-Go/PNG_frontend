<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PNG - 콘테스트 전체 출품작</title>
    <link rel="stylesheet" href="../common/fonts.css" />
    <link rel="stylesheet" href="../common/common.css" />
    <style>
      /* ── Phone Frame ── */
      .phone-frame {
        width: 100%;
        height: 100dvh;
        background: var(--color-bg);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .phone-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* ── Status Bar ── */
      .status-bar {
        height: 54px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
        flex-shrink: 0;
      }
      .status-bar__time {
        font-size: var(--font-md);
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .status-bar__icons {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* ── Nav ── */
      .nav {
        height: 52px;
        padding: 0 20px 0 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        background: #fff;
        flex-shrink: 0;
      }
      .nav__back {
        width: 40px;
        height: 40px;
        border: none;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .nav__title {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.4px;
        color: #000;
      }
      .nav__count {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.4px;
        color: #c7c7cc;
        margin-left: 6px;
      }

      /* ── 정렬 바 (sticky) ── */
      .sortbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        padding: 6px 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--color-border-light);
      }
      .sortbar__sorts {
        height: 34px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding-left: 28px;
      }
      /* 칩(pill) 아님 — 배경 없는 텍스트. 터치 영역만 상하 12px 확장 */
      .sort-btn {
        border: none;
        background: none;
        padding: 12px 0;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: -0.2px;
        color: #8e8e93;
        cursor: pointer;
      }
      .sort-btn.is-active {
        font-weight: 600;
        color: var(--color-accent);
      }
      .sort-dot {
        width: 3px;
        height: 3px;
        border-radius: 2px;
        background: #dcdce0;
        flex-shrink: 0;
      }
      /* 남은 표 pill — 눌리는 것임을 배경과 chevron으로 표시한다.
         하단 바에는 "모두 보기" 하나만 두고, 투표 현황은 표 상태가 이미 있는 이 자리로 모았다. */
      .sortbar__votes {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px 0 12px;
        margin-right: 28px;
        margin-left: auto;
        border: none;
        border-radius: 16px;
        background: var(--color-surface);
        font-family: var(--font-family);
        cursor: pointer;
      }
      .votes__label {
        font-size: var(--font-sm);
        color: #8e8e93;
        letter-spacing: -0.2px;
      }
      .votes__dots {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .votes__dot {
        width: 7px;
        height: 7px;
        border-radius: 4px;
        background: #e6e6ea;
      }
      .votes__dot.is-left {
        background: var(--color-accent);
      }
      .votes__count {
        font-size: var(--font-sm);
        font-weight: 600;
        color: #000;
        letter-spacing: -0.2px;
      }
      .is-spent .votes__label,
      .is-spent .votes__count {
        color: #c7c7cc;
      }

      /* ── 표 소진 안내 배너 ── */
      .spent-banner {
        display: none;
        margin: 14px 28px 0;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--color-surface);
        font-size: var(--font-xs);
        line-height: 1.5;
        letter-spacing: -0.15px;
        color: rgba(0, 0, 0, 0.45);
      }
      .is-spent .spent-banner {
        display: block;
      }

      /* ── 그리드 · 카드 ── */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 20px 28px;
      }
      .card {
        border-radius: 16px;
        overflow: hidden;
        background: var(--color-surface);
      }
      /* 사진 위에 텍스트를 얹지 않는다. 투표 기간에는 순위·득표수를 아예 노출하지 않으므로
         사진 위에 얹을 것이 없다(순위는 진행중 탭의 순위 변동 섹션에서만 공개). */
      .card__photo {
        position: relative;
        aspect-ratio: 1 / 1;
        background: #ededf1;
      }
      /* 순위 배지는 지난 콘테스트(결과 확정 후)에서만 쓴다 */
      .card__rank {
        position: absolute;
        top: 10px;
        left: 10px;
        height: 22px;
        padding: 0 8px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.92);
        display: flex;
        align-items: center;
        font-size: var(--font-2xs);
        font-weight: 600;
        color: #000;
        letter-spacing: -0.1px;
      }
      .card__info {
        padding: 9px 12px 11px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card__text {
        flex: 1;
        min-width: 0;
      }
      .card__name {
        font-size: var(--font-sm);
        font-weight: 600;
        color: #000;
        letter-spacing: -0.2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card__meta {
        font-size: var(--font-xs);
        color: #8e8e93;
        letter-spacing: -0.1px;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── 투표 버튼 (28px 원형) ── */
      .vote-btn {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 14px;
        background: var(--color-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
        padding: 0;
      }
      .vote-btn__voted,
      .vote-btn.is-voted .vote-btn__default {
        display: none;
      }
      .vote-btn.is-voted {
        background: rgba(227, 27, 89, 0.1);
      }
      .vote-btn.is-voted .vote-btn__voted {
        display: block;
      }
      /* 표 소진 — 카드 전체를 흐리지 않고 버튼만 비활성 */
      .is-spent .vote-btn:not(.is-voted) {
        background: #e6e6ea;
        cursor: default;
      }
      .is-spent .vote-btn:not(.is-voted) .vote-btn__default {
        stroke: #b8b8be;
      }

      /* ── 스켈레톤 ── */
      @keyframes shimmer {
        0% { opacity: 0.55; }
        50% { opacity: 1; }
        100% { opacity: 0.55; }
      }
      .skeleton {
        border-radius: 16px;
        overflow: hidden;
        background: var(--color-surface);
        animation: shimmer 1.4s ease-in-out infinite;
      }
      .skeleton__photo {
        aspect-ratio: 1 / 1;
        background: #ededf1;
      }
      .skeleton__info {
        padding: 9px 12px 11px;
      }
      .skeleton__line {
        height: 10px;
        border-radius: 5px;
        background: #e6e6ea;
      }
      .skeleton__line + .skeleton__line {
        margin-top: 6px;
        width: 60%;
      }

      /* ── 목록 끝 ── */
      .list-end {
        padding: 4px 28px 28px;
        text-align: center;
        font-size: var(--font-xs);
        color: #c7c7cc;
        letter-spacing: -0.1px;
      }

      /* ── 빈 상태 · 에러 ── */
      .placeholder {
        padding: 96px 28px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .placeholder__icon {
        width: 56px;
        height: 56px;
        border-radius: 28px;
        background: var(--color-surface);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }
      .placeholder__title {
        font-size: var(--font-md);
        font-weight: 600;
        color: #000;
        letter-spacing: -0.3px;
        margin-top: 4px;
      }
      .placeholder__desc {
        font-size: var(--font-sm);
        color: #8e8e93;
        letter-spacing: -0.2px;
        margin-top: 6px;
        line-height: 1.5;
      }
      .placeholder__cta {
        height: 44px;
        padding: 0 22px;
        margin-top: 20px;
        border: none;
        border-radius: 22px;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 600;
        letter-spacing: -0.2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .placeholder__cta--accent {
        background: var(--color-accent);
        color: #fff;
      }
      .placeholder__cta--plain {
        background: var(--color-surface);
        color: #000;
      }

      /* ── 내가 투표한 작품 시트 (시안 6a·6b) ── */
      .sheet-backdrop {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.34);
        z-index: 60;
      }
      .sheet-backdrop.is-open { display: block; }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        border-radius: 24px 24px 0 0;
        padding: 10px 28px 28px;
      }
      .sheet__handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: #e6e6ea;
        margin: 0 auto;
      }

      /* ── 토스트 ── */
      /* 액션 버튼이 없는 결과 통보라 스낵바가 아니라 토스트 규약을 따른다
         (docs/guide/dev/ui-publishing.md "토스트 · 스낵바 패턴"). */
      .toast {
        position: absolute;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%) translateY(16px);
        z-index: 80;
        height: 44px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        padding: 0 20px;
        color: #fff;
        font-size: var(--font-base);
        font-weight: 500;
        letter-spacing: -0.2px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s, transform 0.3s;
      }
      .toast.is-open {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 상태 전환 (목업 확인용) — 흐름 안에서 렌더, 다크 바로 화면 상단에 붙인다 ── */
      .state-switch {
        flex-shrink: 0;
        display: flex;
        gap: 4px;
        overflow-x: auto;
        background: #000;
        padding: 6px 8px;
      }
      .state-switch button {
        flex-shrink: 0;
        border: none;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 4px 7px;
        font-family: var(--font-family);
        font-size: var(--font-2xs);
        color: rgba(255, 255, 255, 0.55);
        cursor: pointer;
      }
      .state-switch button.is-active {
        background: #fff;
        color: #000;
      }

      .state { display: none; }
      .state.is-active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <!-- 목업 확인용 상태 전환 (실제 화면에는 없음) -->
      <div class="state-switch">
        <button class="is-active" onclick="switchState('list', this)">목록</button>
        <button onclick="switchState('past', this)">지난</button>
        <button onclick="switchState('loading', this)">로딩</button>
        <button onclick="switchState('empty', this)">빈</button>
        <button onclick="switchState('error', this)">에러</button>
      </div>

      <div class="status-bar">
        <span class="status-bar__time">9:41</span>
        <span class="status-bar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0" y="7" width="3" height="4" rx="1" fill="#000"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#000"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#000"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#000"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 9.5l2.5-2.5a3.5 3.5 0 00-5 0L8 9.5z" fill="#000"/><path d="M8 4a6.5 6.5 0 014.6 1.9l1.2-1.2A8.2 8.2 0 008 2.3 8.2 8.2 0 002.2 4.7l1.2 1.2A6.5 6.5 0 018 4z" fill="#000"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#000" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#000"/><path d="M23 4v4a2 2 0 000-4z" fill="#000" fill-opacity="0.4"/></svg>
        </span>
      </div>

      <!-- 네비 — 히어로 없이 타이틀 + 총 개수. 검색 없음 -->
      <div class="nav">
        <button class="nav__back" aria-label="뒤로" onclick="history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <span class="nav__title">전체 출품작</span>
        <span class="nav__count">214</span>
      </div>

      <!-- 목록 -->
      <div class="state is-active" data-state="list">
        <div class="phone-scroll" id="list-scroll">
          <!-- API 정렬 옵션이 LATEST / VOTES 2개라 랜덤은 없다.
               투표 기간 기본은 최신순 — 득표순을 기본으로 두면 상위 작품에 표가 더 몰린다. -->
          <div class="sortbar">
            <div class="sortbar__sorts">
              <button class="sort-btn is-active" onclick="switchSort('latest', this)">최신순</button>
              <span class="sort-dot"></span>
              <button class="sort-btn" onclick="switchSort('votes', this)">득표순</button>
            </div>
            <button class="sortbar__votes" onclick="openMyVotes()">
              <span class="votes__label">남은 표</span>
              <span class="votes__dots" id="vote-dots"></span>
              <span class="votes__count" id="vote-count">3/3</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          </div>

          <!-- 표 소진 안내 (0/3에서만 노출) — 표는 기간 총 3개고 매일 리셋되지 않는다 -->
          <div class="spent-banner">표 3개를 모두 썼어요. 투표를 취소하면 다시 쓸 수 있어요</div>

          <div class="grid" id="entry-grid"></div>
          <div class="list-end">출품작 214개를 모두 봤어요</div>
        </div>
      </div>


      <!-- 지난 콘테스트 — 시안 1b. 결과가 확정된 뒤라 득표순·순위 배지를 다시 쓰고,
           투표 버튼과 남은 표 인디케이터는 없앤다(그 자리엔 마감일). -->
      <div class="state" data-state="past">
        <div class="phone-scroll">
          <div class="sortbar">
            <div class="sortbar__sorts">
              <button class="sort-btn is-active" onclick="switchPastSort('ranked', this)">득표순</button>
              <span class="sort-dot"></span>
              <button class="sort-btn" onclick="switchPastSort('latest', this)">최신순</button>
            </div>
            <div style="flex: 1"></div>
            <div style="padding-right: 28px">
              <span style="font-size: var(--font-sm); color: #8e8e93; letter-spacing: -0.2px">7월 31일 종료</span>
            </div>
          </div>
          <div class="grid" id="past-grid"></div>
          <div class="list-end">출품작 214개를 모두 봤어요</div>
        </div>
      </div>

      <!-- 로딩 스켈레톤 (첫 진입 8장) -->
      <div class="state" data-state="loading">
        <div class="phone-scroll">
          <div class="sortbar">
            <div class="sortbar__sorts">
              <button class="sort-btn is-active">최신순</button>
              <span class="sort-dot"></span>
              <button class="sort-btn">득표순</button>
            </div>
            <div class="sortbar__votes">
              <span class="votes__label">남은 표</span>
              <span class="votes__dots">
                <span class="votes__dot is-left"></span>
                <span class="votes__dot is-left"></span>
                <span class="votes__dot is-left"></span>
              </span>
              <span class="votes__count">3/3</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
            </div>
          </div>
          <div class="grid" id="skeleton-grid"></div>
        </div>
      </div>

      <!-- 빈 상태 -->
      <div class="state" data-state="empty">
        <div class="placeholder">
          <div class="placeholder__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b8b8be" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
          </div>
          <div class="placeholder__title">아직 출품작이 없어요</div>
          <div class="placeholder__desc">첫 번째로 골든아워 사진을 올려보세요</div>
          <button class="placeholder__cta placeholder__cta--accent" onclick="location.href = './contest-submit.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
            출품하기
          </button>
        </div>
      </div>

      <!-- 에러 -->
      <div class="state" data-state="error">
        <div class="placeholder">
          <div class="placeholder__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b8b8be" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
          </div>
          <div class="placeholder__title">목록을 불러오지 못했어요</div>
          <div class="placeholder__desc">네트워크 상태를 확인하고 다시 시도해주세요</div>
          <button class="placeholder__cta placeholder__cta--plain" onclick="switchState('loading')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
            다시 시도
          </button>
        </div>
      </div>

      <!-- 내가 투표한 작품 시트 — 시안 6a(2표 사용) · 6b(빈 상태)
           정렬 바의 남은 표 pill 하나로 열린다(진행중 탭과 목록 화면 모두 같은 경로).
           취소는 다이얼로그 없이 즉시 반영하고 토스트로만 알린다. -->
      <div class="sheet-backdrop" id="myvotes-sheet" onclick="closeSheet('myvotes-sheet')">
        <div class="sheet" style="padding: 10px 28px 28px" onclick="event.stopPropagation()">
          <div class="sheet__handle" style="background: #e6e6ea; margin-bottom: 0"></div>
          <div style="margin-top: 18px; display: flex; align-items: baseline; gap: 6px">
            <span id="myvotes-title" style="font-size: var(--font-lg); font-weight: 600; color: #000; letter-spacing: -0.4px">내가 투표한 작품</span>
            <span id="myvotes-count" style="font-size: var(--font-lg); font-weight: 600; color: #c7c7cc; letter-spacing: -0.4px">0</span>
          </div>

          <div id="myvotes-list" style="margin-top: 18px; display: flex; flex-direction: column; gap: 16px"></div>

          <!-- 빈 상태 -->
          <div id="myvotes-empty" style="display: none">
            <div style="padding: 36px 0 30px; display: flex; flex-direction: column; align-items: center; gap: 8px">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>
              <span style="font-size: var(--font-md); font-weight: 600; color: #000; letter-spacing: -0.3px; margin-top: 4px">아직 투표한 작품이 없어요</span>
              <span style="font-size: var(--font-sm); color: #8e8e93; letter-spacing: -0.2px">이번 콘테스트에 3표를 쓸 수 있어요</span>
            </div>
            <button style="width: 100%; height: 52px; border: none; border-radius: 26px; background: var(--color-accent); color: #fff; font-family: var(--font-family); font-size: var(--font-md); font-weight: 600; letter-spacing: -0.3px; cursor: pointer" onclick="closeSheet('myvotes-sheet')">출품작 보러 가기</button>
          </div>

          <!-- 푸터 — 표가 하나라도 있을 때만.
               2주에 3표뿐이라 신중해지므로 취소가 자유롭다는 점을 한 줄로 안내한다.
               날짜 리셋 관련 문구는 어디에도 두지 않는다. -->
          <div id="myvotes-footer" style="margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(0, 0, 0, 0.07); display: flex; align-items: center; gap: 8px">
            <span style="font-size: var(--font-sm); color: #8e8e93; letter-spacing: -0.2px">남은 표</span>
            <span id="myvotes-dots" style="display: flex; align-items: center; gap: 4px"></span>
            <span id="myvotes-left" style="font-size: var(--font-sm); font-weight: 600; color: #000; letter-spacing: -0.2px">3/3</span>
            <div style="flex: 1"></div>
            <span style="font-size: var(--font-xs); color: #c7c7cc; letter-spacing: -0.1px">투표 마감 전까지 언제든 바꿀 수 있어요</span>
          </div>
        </div>
      </div>
      <div class="toast" id="toast"><span id="toast-text">@rimi 님에게 투표했어요 · 2/3</span></div>
    </div>

    <script>
      /* ── mock 데이터 ── */
      const GRADS = [
        'linear-gradient(165deg,#1a1530,#5a3355 50%,#d4856a)',
        'linear-gradient(165deg,#12333a,#2f5f5a 55%,#8fae9b)',
        'linear-gradient(165deg,#241a33,#8b4a6b 60%,#e8a87c)',
        'linear-gradient(165deg,#2d1b4e,#8b4a6b 55%,#f0c89a)',
        'linear-gradient(165deg,#1c1c2b,#4a3a5e 50%,#c98f7a)',
        'linear-gradient(165deg,#0f1f2e,#3f5a6b 55%,#d9a882)',
        'linear-gradient(165deg,#301c28,#7a4152 55%,#e8a87c)',
        'linear-gradient(165deg,#171d33,#4c4a72 55%,#caa27f)',
      ];
      const LATEST_NAMES = ['@rimi', '@dokyum', '@haneul', '@jiwoo_p', '@seora', '@taeho', '@nayeon', '@eunji'];
      const SPOTS = ['다대포', '청사포', '송정', '이기대', '광안리', '해운대', '태종대', '감천'];
      /* 투표 기간에는 득표수를 노출하지 않는다. 메타는 "스팟 · 출품 시각" */
      const SHOT_TIMES = ['05:32', '18:04', '05:48', '19:12', '05:21', '18:37', '05:44', '19:02'];

      /* 표는 콘테스트 기간(2주) 통틀어 3개이고 매일 리셋되지 않는다 */
      let sort = 'latest';
      let votesLeft = 3;
      const voted = {};
      /* 랜덤이 없어지면서 커서 페이징의 seed 파라미터도 필요 없어졌다 */
      const VOTE_ORDER = [4, 0, 2, 6, 1, 5, 3, 7];

      function buildItems() {
        const order = sort === 'votes' ? VOTE_ORDER : [0, 1, 2, 3, 4, 5, 6, 7];
        return order.map((i) => ({
          id: String(i),
          name: LATEST_NAMES[i],
          meta: SPOTS[i] + ' · ' + SHOT_TIMES[i],
          grad: GRADS[i],
        }));
      }

      const VOTE_ICON =
        '<svg class="vote-btn__default" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>';
      const CHECK_ICON =
        '<svg class="vote-btn__voted" width="14" height="14" viewBox="0 0 24 24" fill="none" style="stroke: var(--color-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';

      function renderGrid() {
        document.getElementById('entry-grid').innerHTML = buildItems()
          .map(
            (c) => `
        <div class="card">
          <div class="card__photo" style="background:${c.grad}" onclick="openEntry()"></div>
          <div class="card__info">
            <div class="card__text" onclick="openEntry()">
              <div class="card__name">${c.name}</div>
              <div class="card__meta">${c.meta}</div>
            </div>
            <button class="vote-btn${voted[c.id] ? ' is-voted' : ''}" aria-label="투표" onclick="toggleVote('${c.id}')">
              ${VOTE_ICON}${CHECK_ICON}
            </button>
          </div>
        </div>`
          )
          .join('');
      }

      function renderVotes() {
        document.getElementById('vote-dots').innerHTML = [0, 1, 2]
          .map((i) => `<span class="votes__dot${i < votesLeft ? ' is-left' : ''}"></span>`)
          .join('');
        document.getElementById('vote-count').textContent = votesLeft + '/3';
        document.querySelector('.phone-frame').classList.toggle('is-spent', votesLeft <= 0);
      }

      /* 카드·그래프 점·범례 행·투표 시트 행 모두 출품작 상세로 온다.
         돌아오면 진입한 화면의 스크롤 위치로 복귀하고, 투표 결과는 즉시 반영된다. */
      function openEntry() {
        location.href = './contest-entry-detail.html';
      }

      /* 투표 기간 안에서는 취소 자유 — 완료 버튼을 다시 누르면 표 1개가 복구된다.
         투표 마감(말일)이 지나면 확정되고 버튼은 비활성으로 고정된다. */
      function toggleVote(id) {
        const item = buildItems().find((c) => c.id === id);
        if (voted[id]) {
          delete voted[id];
          delete votedAt[id];
          votesLeft += 1;
          renderGrid();
          renderVotes();
          renderMyVotes();
          showToast(item.name + ' 투표를 취소했어요 · ' + votesLeft + '/3');
          return;
        }
        if (votesLeft <= 0) return;
        voted[id] = true;
        votedAt[id] = '오늘 14:20';
        votesLeft -= 1;
        renderGrid();
        renderVotes();
        renderMyVotes();
        showToast(item.name + ' 님에게 투표했어요 · ' + votesLeft + '/3');
      }

      let toastTimer = null;
      /* 표가 하루 3개뿐이라 소비된 감각이 즉시 보여야 해서 남은 표를 문구에 함께 넣는다.
         RN에서는 여기에 더해 Haptics.impactAsync(Light)가 함께 발생한다. */
      function showToast(text) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').textContent = text;
        toast.classList.add('is-open');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-open'), 2600);
      }


      /* ── 내가 투표한 작품 시트 (시안 6a·6b) ── */
      const votedAt = {};

      function openSheet(id) { document.getElementById(id).classList.add('is-open'); }
      function closeSheet(id) { document.getElementById(id).classList.remove('is-open'); }

      function openMyVotes() {
        renderMyVotes();
        openSheet('myvotes-sheet');
      }

      function renderMyVotes() {
        const mine = buildItems().filter((c) => voted[c.id]);
        document.getElementById('myvotes-count').textContent = mine.length;
        document.getElementById('myvotes-empty').style.display = mine.length ? 'none' : 'block';
        document.getElementById('myvotes-footer').style.display = mine.length ? 'flex' : 'none';
        document.getElementById('myvotes-list').innerHTML = mine
          .map(
            (c) => `
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0; background: ${c.grad}"></span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: var(--font-sm); font-weight: 600; color: #000; letter-spacing: -0.2px">${c.name}</div>
            <div style="font-size: var(--font-xs); color: #8e8e93; letter-spacing: -0.1px; margin-top: 2px">${votedAt[c.id] || '방금'} · ${c.meta.split(' · ')[0]}</div>
          </div>
          <button onclick="toggleVote('${c.id}')" style="height: 32px; padding: 0 14px; border: none; border-radius: 16px; background: var(--color-surface); font-family: var(--font-family); font-size: var(--font-sm); font-weight: 600; color: #000; letter-spacing: -0.2px; cursor: pointer">취소</button>
        </div>`
          )
          .join('');

        document.getElementById('myvotes-dots').innerHTML = [0, 1, 2]
          .map((i) => `<span style="width: 7px; height: 7px; border-radius: 4px; background: ${i < votesLeft ? 'var(--color-accent)' : '#e6e6ea'}"></span>`)
          .join('');
        document.getElementById('myvotes-left').textContent = votesLeft + '/3';
      }

      function switchSort(next, el) {
        sort = next;
        el.parentElement.querySelectorAll('.sort-btn').forEach((b) => b.classList.remove('is-active'));
        el.classList.add('is-active');
        renderGrid();
        document.getElementById('list-scroll').scrollTop = 0;
      }

      function switchState(state, el) {
        document.querySelectorAll('.state').forEach((s) => {
          s.classList.toggle('is-active', s.dataset.state === state);
        });
        if (el) {
          el.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('is-active'));
          el.classList.add('is-active');
        }
      }


      /* ── 지난 콘테스트 (시안 1b) ── */
      const PAST_NAMES = ['@sunset_jk', '@minsoo', '@yujin', '@haneul', '@jiwoo_p', '@seora', '@taeho', '@nayeon'];
      const PAST_VOTES = [214, 187, 156, 98, 74, 61, 45, 32];
      let pastSort = 'ranked';

      function renderPastGrid() {
        const order = pastSort === 'ranked' ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];
        document.getElementById('past-grid').innerHTML = order
          .map(
            (i, pos) => `
        <div class="card">
          <div class="card__photo" style="background:${GRADS[i]}">
            <span class="card__rank">${pastSort === 'ranked' ? pos + 1 + '위' : i + 1 + '위'}</span>
          </div>
          <div class="card__info">
            <div class="card__text">
              <div class="card__name">${PAST_NAMES[i]}</div>
              <div class="card__meta">${PAST_VOTES[i]}표 · ${SPOTS[i]}</div>
            </div>
          </div>
        </div>`
          )
          .join('');
      }

      function switchPastSort(next, el) {
        pastSort = next;
        el.parentElement.querySelectorAll('.sort-btn').forEach((b) => b.classList.remove('is-active'));
        el.classList.add('is-active');
        renderPastGrid();
      }

      /* 스켈레톤 8장 (사진 1:1 + 정보 영역 2줄) */
      document.getElementById('skeleton-grid').innerHTML = Array.from({ length: 8 })
        .map(
          () => `
      <div class="skeleton">
        <div class="skeleton__photo"></div>
        <div class="skeleton__info">
          <div class="skeleton__line"></div>
          <div class="skeleton__line"></div>
        </div>
      </div>`
        )
        .join('');

      renderGrid();
      renderVotes();
      renderPastGrid();
    </script>
  </body>
</html>
