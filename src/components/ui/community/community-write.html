<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PNG - 새 글 작성</title>
    <link rel="stylesheet" href="../common/fonts.css" />
    <link rel="stylesheet" href="../common/common.css" />
    <style>
      /* ── Phone Frame ── */
      .phone-frame {
        width: 100%;
        height: 100dvh;
        background: var(--color-bg);
        position: relative;
        overflow: hidden;
      }
      .phone-scroll {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 32px;
      }

      /* ── Status Bar ── */
      .status-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 54px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
      }
      .status-bar__time {
        font-size: var(--font-md);
        font-weight: 600;
        color: #000;
        letter-spacing: -0.3px;
      }
      .dynamic-island {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 106px;
        height: 28px;
        background: #000;
        border-radius: 14px;
      }
      .status-bar__icons {
        display: flex;
        gap: 6px;
      }
      .status-bar__icons svg {
        height: 12px;
        fill: #000;
      }

      /* ── Detail Nav (작성 화면: 취소 / 제목 / 게시하기) ── */
      .detail-nav {
        position: sticky;
        top: 54px;
        z-index: 25;
        background: #fff;
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-bottom: 0.5px solid var(--color-border-light);
      }
      .detail-nav__text {
        border: none;
        background: none;
        font-family: var(--font-family);
        font-size: var(--font-base);
        color: rgba(0, 0, 0, 0.55);
        cursor: pointer;
        padding: 6px 0;
      }
      .detail-nav__title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      .detail-nav__submit {
        margin-left: auto;
        height: 32px;
        padding: 0 16px;
        border: none;
        border-radius: 16px;
        background: var(--color-accent);
        color: #fff;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 600;
        letter-spacing: -0.2px;
        cursor: pointer;
      }

      /* ── Bottom Sheet ── */
      .sheet-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 60;
        display: none;
      }
      .sheet-backdrop.is-open { display: block; }
      .sheet {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-radius: 24px 24px 0 0;
        padding: 8px 28px 32px;
        max-height: calc(100% - 40px);
        overflow-y: auto;
      }
      .sheet__handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.15);
        margin: 0 auto 16px;
      }
      .sheet__title {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.4px;
        margin-bottom: 16px;
      }
      .sheet__label {
        font-size: var(--font-xs);
        font-weight: 600;
        color: var(--color-text-secondary);
        letter-spacing: 0.3px;
        padding: 8px 0 6px;
      }

      /* ── Chip ── */
      .chip {
        height: 30px;
        padding: 0 12px;
        border: none;
        border-radius: 15px;
        background: var(--color-surface);
        font-family: var(--font-family);
        font-size: var(--font-sm);
        letter-spacing: -0.2px;
        color: rgba(0, 0, 0, 0.55);
        cursor: pointer;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .chip.is-selected {
        background: rgba(227, 27, 89, 0.08);
        color: var(--color-accent);
        font-weight: 600;
      }
      .chip__count {
        font-size: var(--font-2xs);
        color: var(--color-text-tertiary);
        font-weight: 500;
        letter-spacing: -0.1px;
      }
      .chip.is-selected .chip__count { color: rgba(227, 27, 89, 0.55); }

      /* ── 작성 폼 섹션 ── */
      .compose-section {
        padding: 16px 0;
        border-bottom: 0.5px solid var(--color-border-light);
      }
      .compose-section__label {
        font-size: var(--font-xs);
        font-weight: 600;
        color: var(--color-text-secondary);
        letter-spacing: 0.4px;
      }
      .compose-section__hint {
        font-size: var(--font-2xs);
        color: var(--color-text-tertiary);
        letter-spacing: -0.1px;
      }

      /* ── 촬영 정보 타일 (2×2) ── */
      .meta-tile {
        background: var(--color-surface);
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-family: var(--font-family);
        text-align: left;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .meta-tile--editable { cursor: pointer; }
      .meta-tile__label {
        font-size: var(--font-2xs);
        color: var(--color-text-secondary);
        letter-spacing: 0.3px;
        font-weight: 600;
      }
      .meta-tile__value {
        font-size: var(--font-sm);
        font-weight: 600;
        letter-spacing: -0.2px;
        margin-top: 2px;
      }
      .meta-tile__sub {
        font-size: var(--font-xs);
        color: rgba(0, 0, 0, 0.45);
        letter-spacing: -0.1px;
        margin-top: 1px;
      }

      /* ── 위치 행 ── */
      .location-row {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        border: none;
        background: none;
        padding: 0;
        text-align: left;
        cursor: pointer;
      }
      .location-row__icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(227, 27, 89, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .location-row__name {
        font-size: var(--font-base);
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      .location-row__addr {
        font-size: var(--font-xs);
        color: var(--color-text-secondary);
        letter-spacing: -0.1px;
        margin-top: 1px;
      }

      /* ── 시트 목록 행 ── */
      .pick-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 10px;
        border: none;
        border-radius: 12px;
        background: none;
        font-family: var(--font-family);
        text-align: left;
        cursor: pointer;
      }
      .pick-row.is-selected { background: rgba(227, 27, 89, 0.06); }
      .pick-row__icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--color-surface);
        color: var(--color-text-tertiary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .pick-row__check { flex-shrink: 0; color: var(--color-accent); display: flex; }
      .pick-row:not(.is-selected) .pick-row__check { display: none; }
      .pick-row.is-selected .pick-row__icon {
        background: rgba(227, 27, 89, 0.1);
        color: var(--color-accent);
      }
      .pick-row__name {
        font-size: var(--font-base);
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      .pick-row__meta {
        font-size: var(--font-xs);
        color: var(--color-text-secondary);
        letter-spacing: -0.1px;
        margin-top: 1px;
      }

      .sheet__cta {
        width: 100%;
        height: 52px;
        margin-top: 12px;
        border: none;
        border-radius: 26px;
        background: var(--color-accent);
        color: #fff;
        font-family: var(--font-family);
        font-size: var(--font-md);
        font-weight: 600;
        letter-spacing: -0.2px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="phone-scroll">
        <!-- Status Bar -->
        <div class="status-bar">
          <span class="status-bar__time">9:41</span>
          <div class="dynamic-island"></div>
          <div class="status-bar__icons">
            <svg viewBox="0 0 18 12">
              <rect x="0" y="9" width="3" height="3" rx=".75" />
              <rect x="4.5" y="6" width="3" height="6" rx=".75" />
              <rect x="9" y="3" width="3" height="9" rx=".75" />
              <rect x="13.5" y="0" width="3" height="12" rx=".75" />
            </svg>
            <svg viewBox="0 0 16 14" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round">
              <path d="M5 10.5A4 4 0 0 1 11 10.5" />
              <path d="M2.5 7A8 8 0 0 1 13.5 7" />
              <circle cx="8" cy="13" r="1.2" fill="#000" stroke="none" />
            </svg>
            <svg viewBox="0 0 28 14">
              <rect x="0" y="0" width="25" height="12" rx="3.5" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1" />
              <rect x="1.5" y="1.5" width="20" height="9" rx="2" fill="#34c759" />
            </svg>
          </div>
        </div>

        <!-- Nav -->
        <div class="detail-nav">
          <button class="detail-nav__text" onclick="history.back()">취소</button>
          <span class="detail-nav__title">새 글 작성</span>
          <button class="detail-nav__submit">게시하기</button>
        </div>

        <!-- 사진 -->
        <div style="background: #000">
          <div style="width: 100%; aspect-ratio: 4/3; background: linear-gradient(135deg, #0f2027, #2c5364, #4a7c8a); position: relative">
            <div style="position: absolute; bottom: 12px; right: 12px; height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(0, 0, 0, 0.5); color: rgba(255, 255, 255, 0.85); font-size: var(--font-xs); font-weight: 600; letter-spacing: -0.1px; display: flex; align-items: center">4:3</div>
          </div>
          <div style="display: flex; gap: 2px; padding: 2px 0; background: #111; overflow-x: auto">
            <div style="width: 74px; height: 74px; flex-shrink: 0; background: rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: rgba(255, 255, 255, 0.4)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
              <span style="font-size: var(--font-2xs); letter-spacing: -0.1px">추가</span>
            </div>
            <div style="width: 74px; height: 74px; flex-shrink: 0; background: linear-gradient(135deg, #0f2027, #2c5364, #4a7c8a); box-shadow: inset 0 0 0 1.5px var(--color-accent)"></div>
            <div style="width: 74px; height: 74px; flex-shrink: 0; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460)"></div>
            <div style="width: 74px; height: 74px; flex-shrink: 0; background: linear-gradient(135deg, #2d1b4e, #8b4a6b, #d4856a)"></div>
          </div>
        </div>

        <!-- 폼 -->
        <div style="padding: 0 28px">
          <!-- 캡션 -->
          <div style="padding: 20px 0 8px; border-bottom: 0.5px solid var(--color-border-light)">
            <textarea id="caption" style="width: 100%; min-height: 52px; border: none; background: none; outline: none; resize: none; font-family: var(--font-family); font-size: var(--font-md); font-weight: 500; letter-spacing: -0.2px; line-height: 1.55; color: #000">새벽 5시에 일어난 보람이 있는 일출</textarea>
            <div style="display: flex; justify-content: flex-end; font-size: var(--font-xs); color: rgba(0, 0, 0, 0.25); letter-spacing: -0.1px; margin-top: 6px">24/500</div>
          </div>

          <!-- 위치 -->
          <div class="compose-section">
            <div class="compose-section__label" style="margin-bottom: 10px">위치</div>
            <button class="location-row" id="row-location" onclick="openSheet('location-sheet')">
              <div class="location-row__icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-accent)"><circle cx="12" cy="10" r="3"></circle><path d="M12 21s-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-7 11-7 11z"></path></svg>
              </div>
              <div style="flex: 1; min-width: 0">
                <div class="location-row__name">광안리 해수욕장</div>
                <div class="location-row__addr">부산 수영구 광안해변로 219</div>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
          </div>

          <!-- 촬영 정보 -->
          <div class="compose-section">
            <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px">
              <span class="compose-section__label">촬영 정보</span>
              <span class="compose-section__hint">선택 · 카메라·렌즈는 탭하면 편집</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
              <!-- 일시·날씨는 편집 UI 패턴이 달라 이 화면에서 편집하지 않는다 (plan Task 9 Step 4) -->
              <div class="meta-tile">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
                <div style="min-width: 0">
                  <div class="meta-tile__label">일시</div>
                  <div class="meta-tile__value">2026.05.10</div>
                  <div class="meta-tile__sub">05:30</div>
                </div>
              </div>
              <div class="meta-tile">
                <img src="https://cdn.jsdelivr.net/npm/@meteocons/svg/fill/clear-day.svg" width="20" height="20" alt="" style="opacity: 0.9; flex-shrink: 0; margin-top: -1px" />
                <div style="min-width: 0">
                  <div class="meta-tile__label">날씨</div>
                  <div class="meta-tile__value">맑음</div>
                  <div class="meta-tile__sub">일출 전</div>
                </div>
              </div>
              <button class="meta-tile meta-tile--editable" id="row-camera" onclick="openGearSheet('camera')">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="4"></circle></svg>
                <div style="min-width: 0">
                  <div class="meta-tile__label">카메라</div>
                  <div class="meta-tile__value">Sony A7IV</div>
                  <div class="meta-tile__sub">풀프레임</div>
                </div>
              </button>
              <button class="meta-tile meta-tile--editable" id="row-lens" onclick="openGearSheet('lens')">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.8" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="2"></circle></svg>
                <div style="min-width: 0">
                  <div class="meta-tile__label">렌즈</div>
                  <div class="meta-tile__value">24mm</div>
                  <div class="meta-tile__sub">f/2.8</div>
                </div>
              </button>
            </div>
          </div>

          <!-- 카테고리 -->
          <div style="padding: 16px 0 20px">
            <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px">
              <span class="compose-section__label">카테고리</span>
              <span class="compose-section__hint">다중 선택 · <span id="category-count">2</span>개 선택됨</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <button class="chip" onclick="toggleCategory(this)">역사/전통<span class="chip__count">1,383</span></button>
              <button class="chip" onclick="toggleCategory(this)">공원<span class="chip__count">465</span></button>
              <button class="chip" onclick="toggleCategory(this)">숲<span class="chip__count">338</span></button>
              <button class="chip is-selected" onclick="toggleCategory(this)">야경<span class="chip__count">302</span></button>
              <button class="chip" onclick="toggleCategory(this)">산<span class="chip__count">247</span></button>
              <button class="chip" onclick="toggleCategory(this)">카페<span class="chip__count">208</span></button>
              <button class="chip is-selected" onclick="toggleCategory(this)">일출/일몰<span class="chip__count">206</span></button>
              <button class="chip" onclick="toggleCategory(this)">꽃<span class="chip__count">183</span></button>
            </div>
            <div style="margin-top: 10px; font-size: var(--font-xs); color: var(--color-text-secondary); letter-spacing: -0.15px">선택한 카테고리는 스팟 검색·필터에 사용됩니다.</div>
          </div>
        </div>
      </div>

      <!-- 위치 태그 시트 -->
      <div class="sheet-backdrop" id="location-sheet" onclick="closeSheet('location-sheet')">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet__handle"></div>
          <div class="sheet__title">위치 태그</div>

          <div style="display: flex; align-items: center; gap: 10px; background: var(--color-surface); border-radius: 13px; padding: 0 14px; height: 44px">
            <input type="text" placeholder="스팟 이름 또는 주소 검색" style="flex: 1; border: none; background: none; outline: none; font-family: var(--font-family); font-size: var(--font-base); letter-spacing: -0.2px; color: #000" />
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"></circle><path d="M21 21l-6-6"></path></svg>
          </div>

          <div class="sheet__label">사진 EXIF 기반 추천</div>
          <button class="pick-row is-selected" onclick="selectLocation('광안리 해수욕장', '부산 수영구 광안해변로 219')">
            <div class="pick-row__icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"></circle><path d="M12 21s-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-7 11-7 11z"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0">
              <div class="pick-row__name">광안리 해수욕장</div>
              <div class="pick-row__meta">부산 수영구 광안해변로 219 · 42m</div>
            </div>
            <span class="pick-row__check"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 10-10"></path></svg></span>
          </button>
          <button class="pick-row" onclick="selectLocation('광안대교', '부산 수영구 민락수변공원')">
            <div class="pick-row__icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"></circle><path d="M12 21s-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-7 11-7 11z"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0">
              <div class="pick-row__name">광안대교</div>
              <div class="pick-row__meta">부산 수영구 민락수변공원 · 180m</div>
            </div>
          <span class="pick-row__check"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 10-10"></path></svg></span>
          </button>
          <button class="pick-row" onclick="selectLocation('민락수변공원', '부산 수영구 광안해변로 187')">
            <div class="pick-row__icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"></circle><path d="M12 21s-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-7 11-7 11z"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0">
              <div class="pick-row__name">민락수변공원</div>
              <div class="pick-row__meta">부산 수영구 광안해변로 187 · 320m</div>
            </div>
          <span class="pick-row__check"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 10-10"></path></svg></span>
          </button>

          <div class="sheet__label">최근 검색</div>
          <button class="pick-row" onclick="selectLocation('경복궁 야간개장', '서울 종로구 사직로 161')">
            <div class="pick-row__icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0">
              <div class="pick-row__name">경복궁 야간개장</div>
              <div class="pick-row__meta">서울 종로구 사직로 161</div>
            </div>
          <span class="pick-row__check"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 10-10"></path></svg></span>
          </button>

          <button class="sheet__cta" onclick="closeSheet('location-sheet')">확인</button>
        </div>
      </div>

      <!-- 촬영 정보 시트 (카메라 / 렌즈) -->
      <div class="sheet-backdrop" id="gear-sheet" onclick="closeSheet('gear-sheet')">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet__handle"></div>
          <div class="sheet__title">카메라</div>

          <div style="display: flex; align-items: center; gap: 10px; background: var(--color-surface); border-radius: 13px; padding: 0 14px; height: 48px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="4"></circle></svg>
            <input type="text" id="gear-input" style="flex: 1; border: none; background: none; outline: none; font-family: var(--font-family); font-size: var(--font-base); font-weight: 600; letter-spacing: -0.2px; color: #000" />
          </div>

          <div class="sheet__label" data-gear-kind="camera">자주 쓰는 카메라</div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px" data-gear-kind="camera">
            <button class="chip" onclick="selectGear('Sony A7IV')">Sony A7IV</button>
            <button class="chip" onclick="selectGear('Sony A7C II')">Sony A7C II</button>
            <button class="chip" onclick="selectGear('Canon R6 II')">Canon R6 II</button>
            <button class="chip" onclick="selectGear('Canon R8')">Canon R8</button>
            <button class="chip" onclick="selectGear('Nikon Z6 III')">Nikon Z6 III</button>
            <button class="chip" onclick="selectGear('Fujifilm X-T5')">Fujifilm X-T5</button>
            <button class="chip" onclick="selectGear('iPhone 15 Pro')">iPhone 15 Pro</button>
          </div>

          <div class="sheet__label" data-gear-kind="lens">자주 쓰는 렌즈</div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px" data-gear-kind="lens">
            <button class="chip" onclick="selectGear('24mm f/2.8')">24mm f/2.8</button>
            <button class="chip" onclick="selectGear('35mm f/1.4')">35mm f/1.4</button>
            <button class="chip" onclick="selectGear('50mm f/1.8')">50mm f/1.8</button>
            <button class="chip" onclick="selectGear('24-70mm f/2.8')">24-70mm f/2.8</button>
            <button class="chip" onclick="selectGear('70-200mm f/2.8')">70-200mm f/2.8</button>
            <button class="chip" onclick="selectGear('16-35mm f/4')">16-35mm f/4</button>
          </div>

          <button class="sheet__cta" onclick="confirmGear()">확인</button>
        </div>
      </div>
    </div>

    <script>
      function openSheet(id) {
        document.getElementById(id).classList.add('is-open');
      }
      function closeSheet(id) {
        document.getElementById(id).classList.remove('is-open');
      }

      /* ── 카테고리 다중 선택 ── */
      function toggleCategory(btn) {
        btn.classList.toggle('is-selected');
        document.getElementById('category-count').textContent =
          document.querySelectorAll('.chip.is-selected').length;
      }

      /* ── 위치 선택 ── */
      function selectLocation(name, addr) {
        const row = document.getElementById('row-location');
        row.querySelector('.location-row__name').textContent = name;
        row.querySelector('.location-row__addr').textContent = addr;
        document.querySelectorAll('#location-sheet .pick-row').forEach((el) => {
          el.classList.toggle('is-selected', el.querySelector('.pick-row__name').textContent === name);
        });
        closeSheet('location-sheet');
      }

      /* ── 촬영 정보 시트 (카메라 / 렌즈) ── */
      let gearKind = 'camera';

      function openGearSheet(kind) {
        gearKind = kind;
        const sheet = document.getElementById('gear-sheet');
        sheet.querySelector('.sheet__title').textContent = kind === 'camera' ? '카메라' : '렌즈';
        sheet.querySelectorAll('[data-gear-kind]').forEach((el) => {
          el.style.display = el.dataset.gearKind === kind ? '' : 'none';
        });
        // 입력창은 현재 행 값에서 시작한다
        document.getElementById('gear-input').value = currentGearValue();
        openSheet('gear-sheet');
      }
      function currentGearValue() {
        const rowId = gearKind === 'camera' ? 'row-camera' : 'row-lens';
        return document.querySelector('#' + rowId + ' .meta-tile__value').textContent;
      }
      function selectGear(name) {
        document.getElementById('gear-input').value = name;
        applyGear(name);
        closeSheet('gear-sheet');
      }
      function confirmGear() {
        applyGear(document.getElementById('gear-input').value.trim() || currentGearValue());
        closeSheet('gear-sheet');
      }
      function applyGear(name) {
        const rowId = gearKind === 'camera' ? 'row-camera' : 'row-lens';
        document.querySelector('#' + rowId + ' .meta-tile__value').textContent = name;
        // 보조 라인(풀프레임 / f/2.8)은 원래 사진에서 읽은 값 — 직접 고른 장비에는 해당하지 않는다
        document.querySelector('#' + rowId + ' .meta-tile__sub').textContent = '직접 입력';
        document.querySelectorAll('#gear-sheet [data-gear-kind="' + gearKind + '"] .chip').forEach((c) => {
          c.classList.toggle('is-selected', c.textContent.trim() === name);
        });
      }
    </script>
  </body>
</html>
