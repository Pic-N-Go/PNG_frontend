<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PNG - 화면명</title>
    <link rel="stylesheet" href="../common/fonts.css" />
    <link rel="stylesheet" href="../common/common.css" />
    <style>
      /* ── Phone Frame ── */
      .phone-frame {
        width: 100%;
        height: 100dvh;
        background: var(--color-bg);
        position: relative;
        overflow: hidden;
      }
      .phone-scroll {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 80px;
      }

      /* ── Status Bar ── */
      .status-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 54px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
      }
      .status-bar__time {
        font-size: var(--font-md);
        font-weight: 600;
        color: #000;
        letter-spacing: -0.3px;
      }
      .dynamic-island {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 106px;
        height: 28px;
        background: #000;
        border-radius: 14px;
      }
      .status-bar__icons {
        display: flex;
        gap: 6px;
      }
      .status-bar__icons svg {
        height: 12px;
        fill: #000;
      }

      /* ── Page Nav (콜랩스 헤더) ── */
      .page-nav {
        position: sticky;
        top: 54px;
        z-index: 25;
        background: #fff;
      }
      .page-nav__compact {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
      }
      .page-nav__compact-title {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.4px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .page-nav.is-scrolled .page-nav__compact-title { opacity: 1; }
      .page-nav__large {
        padding: 6px 28px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        overflow: hidden;
        max-height: 60px;
        opacity: 1;
        transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s;
      }
      .page-nav.is-scrolled .page-nav__large {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        opacity: 0;
      }
      .page-nav__large-title {
        font-size: var(--font-2xl);
        font-weight: 600;
        letter-spacing: -1.2px;
        flex: 1;
      }
      .page-nav__icon-btn {
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 19px;
        background: var(--color-surface);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }
      .page-nav__icon-btn--accent { background: var(--color-accent); }
      .page-nav__icon-btn--accent svg { stroke: #fff; }

      /* ── Tab Bar ── */
      .tab-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: #fff;
        border-top: 0.5px solid var(--color-border);
        display: flex;
        align-items: flex-start;
        justify-content: space-around;
        padding-top: 8px;
        z-index: 50;
      }

      /* ── Segment Control (게시글 / 갤러리 / 콘테스트) ── */
      .segment {
        flex: 1;
        display: flex;
        background: var(--color-surface);
        border-radius: 22px;
        padding: 3px;
        height: 36px;
      }
      .segment__btn {
        flex: 1;
        height: 30px;
        border: none;
        border-radius: 15px;
        background: none;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: -0.2px;
        color: rgba(0, 0, 0, 0.45);
        cursor: pointer;
      }
      .segment__btn.is-active {
        background: #000;
        color: #fff;
        font-weight: 600;
      }

      /* ── Sub Tab (언더라인) ── */
      .subtab {
        display: flex;
        gap: 20px;
        padding: 0 28px;
        border-bottom: 1px solid var(--color-border);
      }
      .subtab__btn {
        padding: 10px 0;
        border: none;
        background: none;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: -0.2px;
        color: rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }
      .subtab__btn.is-active {
        color: #000;
        font-weight: 600;
        border-bottom: 2px solid var(--color-accent);
        margin-bottom: -1px;
      }

      /* ── Chip ── */
      .chip {
        height: 30px;
        padding: 0 13px;
        border: none;
        border-radius: 15px;
        background: var(--color-surface);
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: -0.2px;
        color: rgba(0, 0, 0, 0.55);
        cursor: pointer;
        flex-shrink: 0;
      }
      .chip.is-active {
        background: #000;
        color: #fff;
        font-weight: 600;
      }

      /* ── Bottom Sheet ── */
      .sheet-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 60;
        display: none;
      }
      .sheet-backdrop.is-open { display: block; }
      .sheet {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-radius: 24px 24px 0 0;
        padding: 8px 28px 32px;
      }
      .sheet__handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.15);
        margin: 0 auto 16px;
      }
      .sheet__title {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.4px;
        margin-bottom: 16px;
      }
      .sheet__row {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 52px;
        border: none;
        background: none;
        width: 100%;
        font-family: var(--font-family);
        font-size: var(--font-md);
        letter-spacing: -0.2px;
        color: #000;
        cursor: pointer;
        text-align: left;
      }
      .sheet__row--danger { color: var(--color-accent); }

      /* ── Modal ── */
      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 70;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0 40px;
      }
      .modal-backdrop.is-open { display: flex; }
      .modal {
        width: 100%;
        background: #fff;
        border-radius: 20px;
        padding: 24px 20px 16px;
        text-align: center;
      }
      .modal__title {
        font-size: var(--font-md);
        font-weight: 600;
        letter-spacing: -0.3px;
        margin-bottom: 6px;
      }
      .modal__body {
        font-size: var(--font-sm);
        color: rgba(0, 0, 0, 0.5);
        letter-spacing: -0.2px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .modal__actions { display: flex; gap: 8px; }
      .modal__btn {
        flex: 1;
        height: 44px;
        border: none;
        border-radius: 22px;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 600;
        letter-spacing: -0.2px;
        cursor: pointer;
      }
      .modal__btn--cancel { background: var(--color-surface); color: rgba(0, 0, 0, 0.55); }
      .modal__btn--confirm { background: var(--color-accent); color: #fff; }

      /* ── Toast ── */
      .toast {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 100px;
        z-index: 80;
        height: 48px;
        border-radius: 24px;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        color: #fff;
        font-size: var(--font-base);
        letter-spacing: -0.2px;
      }
      .toast.is-open { display: flex; }

      /* ── Score Badge (포토제닉) ── */
      .score-badge {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 26px;
        padding: 0 10px;
        border-radius: 13px;
        background: rgba(227, 27, 89, 0.08);
      }
      .score-badge__label {
        font-size: var(--font-2xs);
        color: rgba(0, 0, 0, 0.5);
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      .score-badge__value {
        font-size: var(--font-sm);
        color: var(--color-accent);
        font-weight: 600;
      }

      /* ── Rank Badge (콘테스트 순위) ── */
      .rank-badge {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f0c89a, #d4856a);
        color: #fff;
        font-size: var(--font-sm);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Avatar ── */
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.85);
        font-size: var(--font-2xs);
        font-weight: 600;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="phone-scroll">
        <!-- Status Bar -->
        <div class="status-bar">
          <span class="status-bar__time">9:41</span>
          <div class="dynamic-island"></div>
          <div class="status-bar__icons">
            <svg viewBox="0 0 18 12">
              <rect x="0" y="9" width="3" height="3" rx=".75" />
              <rect x="4.5" y="6" width="3" height="6" rx=".75" />
              <rect x="9" y="3" width="3" height="9" rx=".75" />
              <rect x="13.5" y="0" width="3" height="12" rx=".75" />
            </svg>
            <svg viewBox="0 0 16 14" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round">
              <path d="M5 10.5A4 4 0 0 1 11 10.5" />
              <path d="M2.5 7A8 8 0 0 1 13.5 7" />
              <circle cx="8" cy="13" r="1.2" fill="#000" stroke="none" />
            </svg>
            <svg viewBox="0 0 28 14">
              <rect x="0" y="0" width="25" height="12" rx="3.5" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1" />
              <rect x="1.5" y="1.5" width="20" height="9" rx="2" fill="#34c759" />
            </svg>
          </div>
        </div>

        <!-- 화면 콘텐츠가 여기에 들어간다 -->
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab" onclick="location.href = '../home/home.html'">
          <svg class="tab__icon" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
            <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
          </svg>
          <span class="tab__label">홈</span>
        </button>
        <button class="tab" onclick="location.href = '../home/map.html'">
          <svg class="tab__icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13" /><path d="M9 4v13" /><path d="M15 7v13" /></svg>
          <span class="tab__label">지도</span>
        </button>
        <button class="tab" onclick="location.href = '../travel/travel-list.html'">
          <svg class="tab__icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="6" cy="19" r="2" /><circle cx="18" cy="5" r="2" /><path d="M12 19h4.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h3.5" /></svg>
          <span class="tab__label">출사</span>
        </button>
        <button class="tab is-active">
          <svg class="tab__icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12"/><path d="M9.5 9h.01"/><path d="M14.5 9h.01"/><path d="M9.5 13a3.5 3.5 0 0 0 5 0"/></svg>
          <span class="tab__label">커뮤니티</span>
        </button>
        <button class="tab" onclick="location.href = '../mypage/mypage.html'">
          <svg class="tab__icon" viewBox="0 0 24 24" stroke="currentColor"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
          <span class="tab__label">MY</span>
        </button>
        <div class="tab-bar__indicator"></div>
      </div>
    </div>
  </body>
</html>
