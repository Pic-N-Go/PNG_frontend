<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PNG - 유저 프로필</title>
    <link rel="stylesheet" href="../common/fonts.css" />
    <link rel="stylesheet" href="../common/common.css" />
    <style>
      /* ── Phone Frame ── */
      .phone-frame {
        width: 100%;
        height: 100dvh;
        background: var(--color-bg);
        position: relative;
        overflow: hidden;
      }
      .phone-scroll {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 80px;
      }

      /* ── Status Bar ── */
      .status-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 54px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
      }
      .status-bar__time {
        font-size: var(--font-md);
        font-weight: 600;
        color: #000;
        letter-spacing: -0.3px;
      }
      .dynamic-island {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 106px;
        height: 28px;
        background: #000;
        border-radius: 14px;
      }
      .status-bar__icons {
        display: flex;
        gap: 6px;
      }
      .status-bar__icons svg {
        height: 12px;
        fill: #000;
      }

      /* ── Detail Nav (콜랩스 없는 풀스크린 헤더) ── */
      .detail-nav {
        position: sticky;
        top: 54px;
        z-index: 25;
        background: #fff;
        height: 52px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 20px;
        border-bottom: 0.5px solid var(--color-border-light);
      }
      .detail-nav__back,
      .detail-nav__more {
        width: 32px;
        height: 32px;
        border: none;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        cursor: pointer;
        flex-shrink: 0;
      }
      .detail-nav__more { margin-left: auto; }
      .detail-nav__title {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.4px;
      }

      /* ── Tab Bar ── */
      .tab-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: #fff;
        border-top: 0.5px solid var(--color-border);
        display: flex;
        align-items: flex-start;
        justify-content: space-around;
        padding-top: 8px;
        z-index: 50;
      }

      /* ── Sub Tab (언더라인) ── */
      .subtab {
        display: flex;
        gap: 22px;
        padding: 8px 28px 0;
        border-bottom: 1px solid var(--color-border-light);
      }
      .subtab__btn {
        padding: 16px 0 10px;
        border: none;
        background: none;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: -0.2px;
        color: rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }
      .subtab__btn.is-active {
        color: #000;
        font-weight: 600;
        border-bottom: 2px solid var(--color-accent);
        margin-bottom: -1px;
      }
      .subtab__count {
        color: rgba(0, 0, 0, 0.25);
        font-weight: 500;
      }
      .subtab__btn.is-active .subtab__count { color: rgba(0, 0, 0, 0.35); }

      /* ── Profile Header ── */
      .profile-head__avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.85);
        font-size: var(--font-xl);
        font-weight: 600;
        letter-spacing: -0.5px;
        flex-shrink: 0;
      }
      .profile-head__name {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .profile-head__handle {
        font-size: var(--font-sm);
        color: rgba(0, 0, 0, 0.4);
        margin-top: 2px;
        letter-spacing: -0.15px;
      }
      .profile-head__award {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
        height: 22px;
        padding: 0 9px;
        border-radius: 11px;
        background: rgba(227, 27, 89, 0.08);
        color: var(--color-accent);
        font-size: var(--font-xs);
        font-weight: 600;
        letter-spacing: -0.1px;
      }
      .profile-bio {
        font-size: var(--font-base);
        color: #000;
        letter-spacing: -0.2px;
        line-height: 1.55;
        margin-bottom: 16px;
      }
      .profile-stats {
        display: flex;
        padding: 14px 4px;
        background: var(--color-surface);
        border-radius: 14px;
        margin-bottom: 16px;
      }
      .profile-stats__cell { flex: 1; text-align: center; }
      .profile-stats__divider { width: 1px; background: var(--color-border-light); }
      .profile-stats__value {
        font-size: var(--font-lg);
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .profile-stats__label {
        font-size: var(--font-xs);
        color: rgba(0, 0, 0, 0.4);
        margin-top: 1px;
        letter-spacing: -0.1px;
      }
      .profile-actions { display: flex; gap: 8px; }
      .profile-actions__btn {
        flex: 1;
        height: 44px;
        border: none;
        border-radius: 22px;
        font-family: var(--font-family);
        font-size: var(--font-base);
        font-weight: 600;
        letter-spacing: -0.2px;
        cursor: pointer;
      }
      .profile-actions__btn--follow {
        background: var(--color-accent);
        color: #fff;
      }
      .profile-actions__btn--follow.is-following {
        background: var(--color-surface);
        color: rgba(0, 0, 0, 0.55);
      }
      .profile-actions__btn--message {
        background: var(--color-surface);
        color: rgba(0, 0, 0, 0.35);
        position: relative;
        cursor: not-allowed;
      }
      .profile-badge-beta {
        position: absolute;
        top: -6px;
        right: 6px;
        height: 16px;
        padding: 0 6px;
        border-radius: 8px;
        background: var(--color-accent);
        color: #fff;
        font-size: var(--font-2xs);
        font-weight: 600;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
      }

      /* ── 탭 뷰 전환 ── */
      .profile-tabview { display: none; }
      .profile-tabview.is-active { display: block; }

      /* ── 게시글 그리드 ── */
      .grid-photo {
        aspect-ratio: 1;
        position: relative;
      }
      .grid-photo__pill {
        position: absolute;
        top: 6px;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 18px;
        padding: 0 6px;
        border-radius: 9px;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        font-size: var(--font-2xs);
        font-weight: 600;
      }
      .grid-photo__pill--likes { right: 6px; }
      .grid-photo__pill--rank {
        left: 6px;
        background: var(--color-accent);
        letter-spacing: 0.3px;
      }

      /* ── 콘테스트 이력 카드 ── */
      .history-card {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: var(--color-surface);
        border-radius: 14px;
      }
      .history-card__thumb {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        flex-shrink: 0;
        position: relative;
      }
      .history-card__rank {
        position: absolute;
        top: 4px;
        left: 4px;
        display: inline-flex;
        align-items: center;
        height: 16px;
        padding: 0 5px;
        border-radius: 8px;
        background: var(--color-accent);
        color: #fff;
        font-size: var(--font-2xs);
        font-weight: 600;
      }
      .history-card__rank--plain { background: rgba(0, 0, 0, 0.4); }
      .history-card__title {
        font-size: var(--font-base);
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      .history-card__meta {
        font-size: var(--font-xs);
        color: rgba(0, 0, 0, 0.4);
        margin-top: 2px;
        letter-spacing: -0.1px;
      }
      .history-card__status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        height: 20px;
        padding: 0 8px;
        border-radius: 10px;
        background: rgba(227, 27, 89, 0.08);
        color: var(--color-accent);
        font-size: var(--font-2xs);
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .history-card__status--win {
        background: var(--color-accent);
        color: #fff;
      }

      /* ── 방문한 스팟 행 ── */
      .spot-row {
        display: flex;
        gap: 12px;
        padding: 12px;
        width: 100%;
        border: none;
        background: var(--color-surface);
        border-radius: 14px;
        font-family: var(--font-family);
        text-align: left;
        cursor: pointer;
      }
      .spot-row__thumb {
        width: 76px;
        height: 76px;
        border-radius: 12px;
        flex-shrink: 0;
        position: relative;
      }
      .spot-row__count {
        position: absolute;
        bottom: 5px;
        right: 5px;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 18px;
        padding: 0 6px;
        border-radius: 9px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: var(--font-2xs);
        font-weight: 600;
      }
      .spot-row__name {
        font-size: var(--font-md);
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      .spot-row__meta {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: var(--font-xs);
        color: rgba(0, 0, 0, 0.4);
        letter-spacing: -0.1px;
      }
      .spot-row__dot {
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.15);
      }

      /* ── 스팟 탭 정렬·지역 필터 ── */
      .sort-btn {
        display: flex;
        align-items: center;
        gap: 3px;
        border: none;
        background: none;
        padding: 0;
        font-family: var(--font-family);
        font-size: var(--font-sm);
        color: rgba(0, 0, 0, 0.5);
        letter-spacing: -0.2px;
        cursor: pointer;
      }
      .region-chip {
        flex-shrink: 0;
        height: 26px;
        padding: 0 10px;
        border: none;
        border-radius: 13px;
        background: var(--color-surface);
        color: rgba(0, 0, 0, 0.5);
        font-family: var(--font-family);
        font-size: var(--font-xs);
        font-weight: 500;
        letter-spacing: -0.1px;
        cursor: pointer;
      }
      .region-chip.is-active {
        background: #000;
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="phone-scroll">
        <!-- Status Bar -->
        <div class="status-bar">
          <span class="status-bar__time">9:41</span>
          <div class="dynamic-island"></div>
          <div class="status-bar__icons">
            <svg viewBox="0 0 18 12">
              <rect x="0" y="9" width="3" height="3" rx=".75" />
              <rect x="4.5" y="6" width="3" height="6" rx=".75" />
              <rect x="9" y="3" width="3" height="9" rx=".75" />
              <rect x="13.5" y="0" width="3" height="12" rx=".75" />
            </svg>
            <svg viewBox="0 0 16 14" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round">
              <path d="M5 10.5A4 4 0 0 1 11 10.5" />
              <path d="M2.5 7A8 8 0 0 1 13.5 7" />
              <circle cx="8" cy="13" r="1.2" fill="#000" stroke="none" />
            </svg>
            <svg viewBox="0 0 28 14">
              <rect x="0" y="0" width="25" height="12" rx="3.5" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1" />
              <rect x="1.5" y="1.5" width="20" height="9" rx="2" fill="#34c759" />
            </svg>
          </div>
        </div>

        <!-- Nav -->
        <div class="detail-nav">
          <button class="detail-nav__back" onclick="history.back()" aria-label="뒤로가기">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <span class="detail-nav__title">@sunset_jk</span>
          <button class="detail-nav__more" aria-label="더보기">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <circle cx="5" cy="12" r="1.8" />
              <circle cx="12" cy="12" r="1.8" />
              <circle cx="19" cy="12" r="1.8" />
            </svg>
          </button>
        </div>

        <!-- 프로필 헤더 -->
        <div style="padding: 24px 28px 16px">
          <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px">
            <div class="profile-head__avatar" style="background: linear-gradient(135deg, #2c5364, #4a7c8a)">JK</div>
            <div style="flex: 1; min-width: 0">
              <div class="profile-head__name">김지우</div>
              <div class="profile-head__handle">@sunset_jk</div>
              <div class="profile-head__award">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                콘테스트 우승 3회
              </div>
            </div>
          </div>

          <div class="profile-bio">새벽 다니는 광안리 상주민. Sony A7IV · 24-70 GM으로 골든아워만 담아요.</div>

          <div class="profile-stats">
            <div class="profile-stats__cell">
              <div class="profile-stats__value">142</div>
              <div class="profile-stats__label">게시글</div>
            </div>
            <div class="profile-stats__divider"></div>
            <div class="profile-stats__cell">
              <div class="profile-stats__value">3,820</div>
              <div class="profile-stats__label">팔로워</div>
            </div>
            <div class="profile-stats__divider"></div>
            <div class="profile-stats__cell">
              <div class="profile-stats__value">248</div>
              <div class="profile-stats__label">팔로잉</div>
            </div>
          </div>

          <div class="profile-actions">
            <button class="profile-actions__btn profile-actions__btn--follow" onclick="toggleFollow(this)">팔로우</button>
            <button class="profile-actions__btn profile-actions__btn--message" disabled>
              메시지
              <span class="profile-badge-beta">BETA</span>
            </button>
          </div>
        </div>

        <!-- 탭 -->
        <div class="subtab">
          <button class="subtab__btn is-active" onclick="switchProfileTab('posts', this)">게시글 <span class="subtab__count">142</span></button>
          <button class="subtab__btn" onclick="switchProfileTab('contests', this)">콘테스트 <span class="subtab__count">18</span></button>
          <button class="subtab__btn" onclick="switchProfileTab('spots', this)">방문한 스팟 <span class="subtab__count">36</span></button>
        </div>

        <!-- 게시글 -->
        <div class="profile-tabview is-active" data-tab="posts">
          <div style="padding: 14px 20px 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px">
            <div class="grid-photo" style="background: linear-gradient(to bottom, #0f2027, #203a43, #4a7c8a)">
              <div class="grid-photo__pill grid-photo__pill--likes">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="#ff453a" stroke="none"><path d="M12 21s-7-4.5-7-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-7 11-7 11z"></path></svg>
                248
              </div>
            </div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #1a1530, #b44a3a, #f0c89a)">
              <div class="grid-photo__pill grid-photo__pill--rank">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                1위
              </div>
            </div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #232526, #8e7b5a)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #1a1510, #a08060)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #0a1a0f, #4a8060)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #020010, #1a1545)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #1a0f1e, #c080a0)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #2a2e35, #6a7580)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #0f1a2a, #2a5a8a)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #1a0a0a, #8a3030)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #0a2020, #40a090)"></div>
            <div class="grid-photo" style="background: linear-gradient(to bottom, #0f2027, #e8a87c)"></div>
          </div>
        </div>

        <!-- 콘테스트 -->
        <div class="profile-tabview" data-tab="contests">
          <div style="padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 8px">
            <div class="history-card">
              <div class="history-card__thumb" style="background: linear-gradient(to bottom, #1a1530, #b44a3a, #f0c89a)">
                <div class="history-card__rank">1위</div>
              </div>
              <div style="flex: 1; min-width: 0">
                <div class="history-card__title">골든아워</div>
                <div class="history-card__meta">진행중 · 67표 · D-3</div>
                <div class="history-card__status">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle></svg>
                  진행중
                </div>
              </div>
            </div>
            <div class="history-card">
              <div class="history-card__thumb" style="background: linear-gradient(to bottom, #0a1a0f, #4a8060)">
                <div class="history-card__rank">1위</div>
              </div>
              <div style="flex: 1; min-width: 0">
                <div class="history-card__title">숲 산책</div>
                <div class="history-card__meta">3주 전 · 89표 · 우승</div>
                <div class="history-card__status history-card__status--win">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                  우승
                </div>
              </div>
            </div>
            <div class="history-card">
              <div class="history-card__thumb" style="background: linear-gradient(to bottom, #1a1510, #a08060)">
                <div class="history-card__rank history-card__rank--plain">3위</div>
              </div>
              <div style="flex: 1; min-width: 0">
                <div class="history-card__title">골목의 낮</div>
                <div class="history-card__meta">5주 전 · 41표</div>
              </div>
            </div>
            <div class="history-card">
              <div class="history-card__thumb" style="background: linear-gradient(to bottom, #020010, #1a1545)">
                <div class="history-card__rank">1위</div>
              </div>
              <div style="flex: 1; min-width: 0">
                <div class="history-card__title">밤하늘</div>
                <div class="history-card__meta">4주 전 · 124표 · 우승</div>
                <div class="history-card__status history-card__status--win">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                  우승
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 방문한 스팟 -->
        <div class="profile-tabview" data-tab="spots">
          <div style="padding: 12px 20px; display: flex; align-items: center; gap: 8px">
            <button class="sort-btn">
              자주 간 순
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
            </button>
            <div style="margin-left: auto; display: flex; gap: 6px; overflow-x: auto">
              <button class="region-chip is-active" onclick="selectRegion(this)">전체</button>
              <button class="region-chip" onclick="selectRegion(this)">부산</button>
              <button class="region-chip" onclick="selectRegion(this)">서울</button>
            </div>
          </div>

          <div style="padding: 0 20px 12px; display: flex; flex-direction: column; gap: 8px">
            <button class="spot-row">

      function switchProfileTab(tab, el) {
        document.querySelectorAll('.profile-tabview').forEach((v) => {

        });
        el.parentElement.querySelectorAll('.subtab__btn').forEach((b) => {
          b.classList.toggle('is-active', b === el);
        });
      }

      /* ── 팔로우 토글 ── */
      function toggleFollow(el) {
        const following = el.classList.toggle('is-following');
        el.textContent = following ? '팔로잉' : '팔로우';
      }

      /* ── 지역 필터 (표시용 단일 선택) ── */
      function selectRegion(el) {
